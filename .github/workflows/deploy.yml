# Builds the site and publishes it to GitHub Pages on every push to main.
# In the repository's Settings → Pages, set "Source" to "GitHub Actions" once.
#
# The site is built for /forever/, so a repository named `forever` serves it at
# https://<user>.github.io/forever/ unchanged. For any other repository name, SITE_BASE
# moves it to /<repository>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

      - name: Build
        run: |
          npm ci
          make

      - name: Move the site to the repository's path
        if: env.SITE_BASE != '/forever/'
        run: bash tools/site_base.sh dist/forever

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/forever

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
