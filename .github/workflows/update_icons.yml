name: Update Icons

# Mirrors the Wowhead images the site displays into assets/img/wowhead and commits any new
# ones to the branch it was run on. Run it after a database refresh or when the UI starts
# referencing an icon it did not before. The mirror is not served yet on forever-next's UI,
# which still loads wow.zamimg.com URLs directly; tools/icons already collects those URLs.
on: workflow_dispatch

jobs:
    update-icons:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Fetch images
              run: go run ./tools/icons

            - name: Commit
              run: |
                  git add assets/img/wowhead
                  if git diff --cached --quiet; then
                    echo "Nothing new to commit"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore(assets): mirror wowhead images"
                  git push
