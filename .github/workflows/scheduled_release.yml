name: Scheduled Release

on:
    workflow_dispatch:
    schedule:
        - cron: '0 10 * * 1'

jobs:
    schedule:
        permissions: write-all
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            # Release tags only: the newest tag of any kind (official-mixed-2026-09-21) is not a
            # version, and failed every run. No release yet means v0.0.0 and a release now.
            - name: 'Get Previous tag'
              id: previoustag
              run: echo "tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)" >> $GITHUB_OUTPUT

            - name: 'Get Commit Hashes'
              id: getcommithashes
              run: |
                  echo "current=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
                  echo "last=$(git rev-parse -q --verify '${{ steps.previoustag.outputs.tag }}^{commit}' || true)" >> $GITHUB_OUTPUT

            - name: 'Get next version'
              if: steps.getcommithashes.outputs.current != steps.getcommithashes.outputs.last
              id: semvers
              uses: 'WyriHaximus/github-action-next-semvers@v1'
              with:
                  version: ${{ steps.previoustag.outputs.tag }}

            - name: 'Print version'
              if: steps.getcommithashes.outputs.current != steps.getcommithashes.outputs.last
              id: printversion
              run: echo ${{ steps.semvers.outputs.v_patch }}

            - name: Trigger Release
              if: steps.getcommithashes.outputs.current != steps.getcommithashes.outputs.last
              uses: benc-uk/workflow-dispatch@v1
              with:
                  workflow: Release
                  inputs: '{ "ref": "master", "tag": "${{ steps.semvers.outputs.v_patch }}" }'
