name: Build Arena

# Runs every build the sim can be given and commits the leaderboard to ui/app/arena/results.json,
# which the arena page renders without simulating anything in the browser.
#
# This is also the entire cache story. The committed file is the cache, the commit that
# produced it is the key, and this workflow is the invalidation: nothing has to notice that a
# spell changed, because the only thing that ever writes the file is a run that happened
# after the change. The paths below are what a build's number can actually depend on.
# Manual only. This used to run on every push to master, and that made two writers for one
# file: a four hour search on Tonberry finished to find CI had already replaced its results
# with a rebuild that carried only the talents it had found by the time CI started. The
# searched leaderboard is Tonberry's - tools/arena/background.py - and nothing else commits it.
#
# Staleness is not lost by this: results.json records the commit that produced it, and the
# page compares that against the site's own commit and says so when they have drifted.
on:
    workflow_dispatch:

# Each run commits to the branch it was run on, so two of them racing means the loser is rejected as a
# non fast forward. Queued rather than cancelled: a cancelled run leaves the leaderboard
# describing a sim nobody is running any more.
concurrency:
    group: build-arena
    cancel-in-progress: false

jobs:
    arena:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        # Several hundred runs at five thousand iterations each. The specs go in parallel, but
        # rogue alone is most of it: nine gear sets times seven rotations.
        #
        # The talent search does NOT run here. A GitHub-hosted job is hard-capped at six hours,
        # which the exhaustive pass does not fit inside at any spec size worth doing, so the
        # searches run on a host with no ceiling (tools/arena/run-local.ps1) and this workflow is
        # only the fast rebuild that keeps the leaderboard honest after a push.
        timeout-minutes: 120
        steps:
            # The branch it was dispatched on, and it pushes back to that branch.
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            # The protos are generated, not committed, and sim/web embeds the built site through
            # binary_dist; the stub stands in for it. Without both, loading ./sim/... fails before
            # a single build is simulated.
            - name: Generate the protos and the dist stub
              run: make sim/core/proto/api.pb.go binary_dist/dist.go

            # Named packages rather than ./sim/... : sim/web is a server, has no arena entry, and
            # its presence in the pattern is what made the first run fail.
            - name: Run the arena
              run: go test --tags=with_db -timeout 340m -count=1 -v -run TestArena $(go list ./sim/... | grep -v '/sim/web')
              env:
                  ARENA_OUT: ${{ github.workspace }}/arena-out
                  # ARENA_OPTIMISE is never set here. Searching is the part that does not fit in a six
                  # hour job, and a search that runs out of time commits nothing, so this workflow
                  # deliberately only re-simulates builds that already exist.

            - name: Merge and score
              run: go run ./tools/arena arena-out ui/app/arena/results.json

            - name: Commit
              run: |
                  git add ui/app/arena/results.json
                  if git diff --cached --quiet; then
                    echo "The leaderboard has not moved"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore(arena): rebuild the leaderboard"
                  for attempt in 1 2 3 4 5; do
                    if git push; then
                      exit 0
                    fi
                    echo "push rejected, rebasing on ${{ github.ref_name }} (attempt $attempt)"
                    git pull --rebase origin ${{ github.ref_name }}
                  done
                  echo "could not push after five attempts"
                  exit 1
