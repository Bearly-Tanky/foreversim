name: New issue webhook
on:
    issues:
        types: [opened]

jobs:
    send_webhook:
        runs-on: ubuntu-latest
        env:
            DISCORD_WEBHOOK: ${{ secrets.WEBHOOK_URL }}
        steps:
            # This job used to be `continue-on-error` followed by a step that ran `exit 0`, so it
            # reported success on every run while sending nothing at all - the WEBHOOK_URL secret has
            # never existed. A hook that cannot fail never tells you it is broken, which is why two
            # issues went unannounced without anyone noticing a red mark anywhere.
            # The secret is read into `env` at job level on purpose: the `secrets` context is not
            # available in a step-level `if:`, and using it there makes the whole file invalid, which
            # GitHub reports as a failed run on every push.
            - name: Check the webhook is configured
              run: |
                  if [ -z "$DISCORD_WEBHOOK" ]; then
                    echo "::error::WEBHOOK_URL is not set, so no notification was sent for this issue."
                    echo "Set it with: gh secret set WEBHOOK_URL --repo $GITHUB_REPOSITORY"
                    exit 1
                  fi

            - name: Send webhook
              uses: Ilshidur/action-discord@master
              with:
                  args: 'New issue by {{ EVENT_PAYLOAD.issue.user.login }}: **{{ EVENT_PAYLOAD.issue.title }}** {{ EVENT_PAYLOAD.issue.html_url }}'
